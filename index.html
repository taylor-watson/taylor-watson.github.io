<style>
    body {
        margin: 0;
        font-family: 'EB Garamond', serif;
    }

    /* Container for two-column layout */
    .container {
        display: flex;
        flex-direction: row;
        min-height: 100vh;
    }

    .left-column {
        flex: 0 0 560px; /* fixed width on large screens */
        padding: 20px;
        box-sizing: border-box;
        background-color: #f9f9f9;
        overflow-y: auto;
        position: sticky; /* stays visible when scrolling */
        top: 0;
        height: 100vh;
    }

    .right-column {
        flex: 1;
        padding: 20px;
        min-width: 0; /* prevents overflow */
    }

    .profile-pic {
        width: 100%;
        max-width: 500px;
        height: auto;
        border-radius: 6px;
        display: block;
        margin-bottom: 15px;
    }

    h1, h2, h3 {
        margin-top: 0.5em;
        margin-bottom: 0.5em;
    }

    ul {
        padding-left: 20px;
    }

    a {
        color: #004080;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (max-width: 1200px) {
        .left-column {
            flex: 0 0 400px;
        }
        .profile-pic {
            max-width: 350px;
        }
    }

    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }
        .left-column {
            width: 100%;
            height: auto;
            position: relative;
        }
        .right-column {
            margin-left: 0;
        }
        .profile-pic {
            max-width: 100%;
        }
    }
</style>
